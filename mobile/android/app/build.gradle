apply plugin: 'com.android.application'

// ── release 签名（CLAUDE.md 0.10：统一用主密钥 richkobe-release.jks，禁 debug/随机证书）──────
// 同密钥是「用户覆盖安装升级」的前提，每次随机证书会导致老用户装不上新版。
//
// 凭据双通道，按优先级：
//   1. CI（GitHub Actions）：secrets 注入的环境变量 —— 仓库里没有密钥文件，这是唯一可行通道。
//   2. 本机：key.properties（该文件仅本地存在，已 gitignore + .git/info/exclude 双保险）。
//      ★ storeFile 必须用【正斜杠】路径：Java Properties 里反斜杠是转义符，
//        `D:\1Tools\keys\x.jks` 会被读成 `D:1Toolskeysx.jks`（静默错，不报错）。
//   两者都缺 → 回退 debug key 并打警告（只为「本地临时构建能跑」，发版产物绝不允许走这条）。
def ccmStoreFile = System.getenv('CCM_KEYSTORE_PATH') ?: null
def ccmStorePassword = System.getenv('CCM_KEYSTORE_PASSWORD') ?: null
def ccmKeyAlias = System.getenv('CCM_KEY_ALIAS') ?: null
def ccmKeyPassword = System.getenv('CCM_KEY_PASSWORD') ?: null

if (!ccmStoreFile) {
    def kpFile = rootProject.file('key.properties')
    if (kpFile.exists()) {
        def kp = new Properties()
        kpFile.withInputStream { kp.load(it) }
        ccmStoreFile = kp.getProperty('storeFile')
        ccmStorePassword = kp.getProperty('storePassword')
        ccmKeyAlias = kp.getProperty('keyAlias')
        ccmKeyPassword = kp.getProperty('keyPassword')
    }
}

android {
    namespace = "com.richkobe.claudechatmobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.richkobe.claudechatmobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // ── ABI 分包：只出 arm64-v8a ─────────────────────────────────────────
    // 为什么分：不分包时 APK 含全部四种 ABI 的 native 库（x86/x86_64/armeabi-v7a/arm64-v8a），
    // 而目标设备（一加 Ace 5 Pro 等现代安卓机）只需 arm64，其余是纯浪费体积。
    // 为什么只留 arm64：本产品是 WebView 壳，native 库只有 Capacitor 自身那几个（体积很小），
    // 但 CLAUDE.md 0.10 的产物命名规范是 `软件名-版本-android-arm64.apk` —— 单 ABI 才能让
    // 文件名如实描述内容；出 universal 包却叫 arm64 是名不符实。
    // universalApk 关掉：不留「什么都能装」的兜底包，避免有人误装它当成 arm64 版分发。
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a'
            universalApk false
        }
    }
    signingConfigs {
        if (ccmStoreFile) {
            release {
                storeFile file(ccmStoreFile)
                storePassword ccmStorePassword
                keyAlias ccmKeyAlias
                keyPassword ccmKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // 有主密钥就用它；没有则回退 debug（仅本地临时构建，发版必须走 CI 或配好 key.properties）
            if (ccmStoreFile) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
                logger.warn('[CCM] 未找到 release 签名凭据（无 CCM_KEYSTORE_* 环境变量、无 key.properties），本次 release 将用 debug key 签名——不可用于发版')
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
