<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Claude Chat Mobile richkobe</title>
  <desc id="desc">M3 砖橙底上的放射火花，中心镂空终端提示符；径向渐变高光给球体体积感。</desc>
  <defs>
    <!-- M3 primary 色阶：tone40 #9B442B 为底，左上 tone50 提亮、右下 tone30 压暗，形成球面光。
         不用纯黑投影：M3 的体积靠 tonal 位移，不靠灰阶阴影。 -->
    <radialGradient id="orb" cx="0.34" cy="0.28" r="0.95">
      <stop offset="0" stop-color="#BB5B40"/>
      <stop offset="0.55" stop-color="#9B442B"/>
      <stop offset="1" stop-color="#7C2D16"/>
    </radialGradient>
    <path id="ray-long" d="M239 203 224 78Q223 65 236 59L248 61Q258 64 260 77L267 203Z"/>
    <path id="ray-medium" d="M241 204 229 96Q228 83 240 78L251 80Q261 83 262 96L267 204Z"/>
    <path id="ray-short" d="M242 204 233 116Q232 103 244 99L253 101Q263 104 263 117L267 204Z"/>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#orb)"/>

  <g fill="#FFF7ED">
    <use href="#ray-long" transform="rotate(-4 256 256)"/>
    <use href="#ray-medium" transform="rotate(27 256 256)"/>
    <use href="#ray-long" transform="rotate(58 256 256)"/>
    <use href="#ray-short" transform="rotate(87 256 256)"/>
    <use href="#ray-medium" transform="rotate(116 256 256)"/>
    <use href="#ray-short" transform="rotate(147 256 256)"/>
    <use href="#ray-long" transform="rotate(178 256 256)"/>
    <use href="#ray-medium" transform="rotate(209 256 256)"/>
    <use href="#ray-long" transform="rotate(239 256 256)"/>
    <use href="#ray-short" transform="rotate(269 256 256)"/>
    <use href="#ray-medium" transform="rotate(300 256 256)"/>
    <use href="#ray-short" transform="rotate(331 256 256)"/>
    <circle cx="256" cy="256" r="92"/>
  </g>

  <!-- 终端提示符：用 tone30 深砖橙而非纯底色，镂空处带一点内阴影感 -->
  <path d="M211 215 253 256 211 297" fill="none" stroke="#7C2D16" stroke-width="31" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M280 297H327" fill="none" stroke="#7C2D16" stroke-width="31" stroke-linecap="round"/>
</svg>
